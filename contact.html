<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Rocky Systems</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
    <nav class="bg-blue-900 text-white p-6 shadow-lg">
      <div class="container mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold">Rocky Systems</h1>
        <div class="space-x-4">
          <a href="index.html" class="hover:text-blue-200">Home</a>
          <a href="services.html" class="hover:text-blue-200">Services</a>
          <a href="about.html" class="hover:text-blue-200">About</a>
          <a href="contact.html" class="hover:text-blue-200">Contact</a>
        </div>
      </div>
    </nav>

    <main class="flex-grow">
      <div class="container mx-auto py-16 px-4 max-w-lg">
        <h2 class="text-3xl font-bold mb-8">Let’s Discuss Your IT Needs.</h2>
        <p class="mb-6 text-gray-700">
          Whether you have a specific project in mind or just want to learn more
          about how we can help, we’re here to listen.
        </p>
        <form
          action="https://formspree.io/f/mojybqqe"
          method="POST"
          class="space-y-4"
        >
          <div>
            <label class="block mb-1 text-sm font-medium">Name</label>
            <input
              type="text"
              name="name"
              required
              class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none"
            />
          </div>
          <div>
            <label class="block mb-1 text-sm font-medium">Email</label>
            <input
              type="email"
              name="email"
              required
              class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none"
            />
          </div>
          <div>
            <label class="block mb-1 text-sm font-medium">Message</label>
            <textarea
              name="message"
              rows="4"
              required
              class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none"
            ></textarea>
          </div>
          <button
            type="submit"
            class="w-full bg-blue-900 text-white py-2 rounded-lg font-semibold hover:bg-blue-800 transition"
          >
            Send Inquiry
          </button>
        </form>
      </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-8 mt-12">
      <div class="container mx-auto px-4 text-center">
        <p class="text-sm">&copy; 2026 Rocky Systems. All rights reserved.</p>
        <div class="mt-4 space-x-6 text-sm">
          <a href="index.html" class="hover:text-white transition">Home</a>
          <a href="services.html" class="hover:text-white transition"
            >Services</a
          >
          <a href="about.html" class="hover:text-white transition">About</a>
          <a href="contact.html" class="hover:text-white transition">Contact</a>
        </div>
      </div>
    </footer>
  </body>
</html>
